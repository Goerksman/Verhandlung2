<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Studienstart – Weiterleitung</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:#f7f7f8;
      margin:0;
      padding:0;
    }
    .wrap {
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .card {
      background:#fff;
      border-radius:16px;
      border:1px solid #e5e7eb;
      padding:24px;
      box-shadow:0 2px 12px rgba(0,0,0,.04);
    }
    h1 { margin:0 0 12px; font-size:1.6rem; }
    p { margin:0 0 8px; color:#4b5563; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Lade Studienaufgabe …</h1>
      <p>Du wirst gleich zufällig einer von mehreren Varianten zugewiesen.</p>
      <p>Bitte einen Moment gedulden.</p>
    </div>
  </div>

  <script>
    // Treatment-URLs (Verhandlung2 wurde entfernt)
    const TREATMENTS = [
      "https://goerksman.github.io/Verhandeln.github.io/",
      "https://goerksman.github.io/Verhandlung3/",
      "https://goerksman.github.io/Verhandlung4/",
      "https://goerksman.github.io/Verhandlung-5/",
      "https://goerksman.github.io/Verhandlung-6/"
    ];

    // Optional: vorhandene Query-Parameter (z.B. ?code=ABC123) weiterreichen
    const query = window.location.search; // inkl. '?', sonst leer

    // Helper: Query sauber an URL anhängen (falls URL schon ? hat)
    function appendQuery(url, queryString) {
      if (!queryString) return url;
      return url.includes("?") ? (url + "&" + queryString.slice(1)) : (url + queryString);
    }

    // Pro Browser die Zuweisung stabil halten
    const STORAGE_KEY = "assignedTreatmentIndex";
    let assignedIndex = localStorage.getItem(STORAGE_KEY);

    // Kompatibilität: Wenn früher 6 Treatments existierten (0..5),
    // dann müssen wir alte Indizes auf die neue 5er-Liste mappen:
    // alt 0 -> neu 0
    // alt 1 (Verhandlung2) -> neu auslosen
    // alt 2 -> neu 1
    // alt 3 -> neu 2
    // alt 4 -> neu 3
    // alt 5 -> neu 4
    if (assignedIndex !== null) {
      const oldIdx = parseInt(assignedIndex, 10);

      if (Number.isNaN(oldIdx)) {
        assignedIndex = null;
        localStorage.removeItem(STORAGE_KEY);
      } else if (oldIdx === 1) {
        // Das war die entfernte Seite -> neu auslosen
        assignedIndex = null;
        localStorage.removeItem(STORAGE_KEY);
      } else if (oldIdx >= 2 && oldIdx <= 5) {
        const mapped = oldIdx - 1; // 2->1, 3->2, 4->3, 5->4
        assignedIndex = String(mapped);
        localStorage.setItem(STORAGE_KEY, assignedIndex);
      } else if (oldIdx < 0 || oldIdx >= TREATMENTS.length) {
        // Irgendwas Ungültiges gespeichert -> neu auslosen
        assignedIndex = null;
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    // Gleichverteilung über alle verbleibenden Seiten
    if (assignedIndex === null) {
      const idx = Math.floor(Math.random() * TREATMENTS.length); // 0..length-1, gleichverteilt
      assignedIndex = String(idx);
      localStorage.setItem(STORAGE_KEY, assignedIndex);
    }

    const index = parseInt(assignedIndex, 10);
    const baseUrl = TREATMENTS[index];
    const target = appendQuery(baseUrl, query);

    // Weiterleitung – replace, damit diese Router-Seite nicht im Verlauf hängt
    window.location.replace(target);
  </script>
</body>
</html>
